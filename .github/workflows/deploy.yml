# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages
# serves at https://apurba-sardar.github.io/<repository name>/
# (Settings → Pages → Deploy from a branch → gh-pages, / (root)).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/portfolio-motion-graphics-4hs1k6]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # absolute links (social cards, canonical) point at wherever this repo's Pages site lives
      - run: VITE_SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" npm run build
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Pages publishes gh-pages in a run of its own, so wait until this build is served.
      # A custom domain on the account's <owner>.github.io site moves this site under it.
      - name: Check the live site
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          js=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          for i in $(seq 30); do
            res=$(curl -sSL -o live.html -w '%{http_code} %{url_effective}' "$url?v=$GITHUB_SHA") \
              || { echo "::error::Could not load $url (stopped at ${res#* })"; exit 1; }
            if grep -q "$js" live.html; then echo "Live at ${res#* }"; exit 0; fi
            echo "Waiting for Pages: HTTP $res"
            sleep 10
          done
          echo "::error::$url is not serving this build after 5 minutes (last: HTTP $res)"
          exit 1
