# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Deploy from a branch → gh-pages, / (root)): at the custom domain in
# public/CNAME (the build copies it to the branch, which is what sets the domain on Pages), or
# without one at https://<owner>.github.io/<repository name>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/portfolio-motion-graphics-4hs1k6]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # absolute links (social cards, canonical) point at wherever the site is served
      - name: Build
        run: |
          if [ -s public/CNAME ]; then
            host=$(tr -d '[:space:]' < public/CNAME)
            url="https://$host/"
          else
            host="${GITHUB_REPOSITORY_OWNER,,}.github.io"
            url="https://$host/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "SITE_HOST=$host" >> "$GITHUB_ENV"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          VITE_SITE_URL="$url" npm run build
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Pages publishes gh-pages in a run of its own, so wait until this build is served.
      # A custom domain is asked for straight at GitHub's Pages servers, so this works while
      # its DNS records are still on their way round.
      - name: Check the live site
        run: |
          js=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          ips=(185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153)
          for i in $(seq 30); do
            if [ -s public/CNAME ]; then
              ip=${ips[i % 4]}
              res=$(curl -sSL --resolve "$SITE_HOST:80:$ip" --resolve "$SITE_HOST:443:$ip" -o live.html \
                -w '%{http_code} %{url_effective}' "http://$SITE_HOST/?v=$GITHUB_SHA") || res="000 (no answer from $ip)"
            else
              res=$(curl -sSL -o live.html -w '%{http_code} %{url_effective}' "$SITE_URL?v=$GITHUB_SHA") || res="000 (no answer)"
            fi
            if grep -q "$js" live.html 2>/dev/null; then echo "Live at $SITE_URL (HTTP $res)"; exit 0; fi
            echo "Waiting for Pages: HTTP $res"
            sleep 10
          done
          echo "::error::$SITE_URL is not serving this build after 5 minutes (last: HTTP $res)"
          exit 1
      # what the world sees of the custom domain: its DNS records and whether it answers over HTTPS
      # (a warning, not a failure: DNS lives at the registrar, and the certificate comes after it)
      - name: Report the custom domain
        if: hashFiles('public/CNAME') != ''
        run: |
          a=$(dig +short A "$SITE_HOST" | sort | tr '\n' ' ')
          www=$(dig +short CNAME "www.$SITE_HOST" | tr '\n' ' ')
          echo "A $SITE_HOST: ${a:-none}"
          echo "CNAME www.$SITE_HOST: ${www:-none}"
          want="185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153 "
          [ "$a" = "$want" ] || echo "::warning::$SITE_HOST should have exactly the four A records $want(it has: ${a:-none})"
          case "$www" in *.github.io.*) ;; *) echo "::warning::www.$SITE_HOST should be a CNAME to ${GITHUB_REPOSITORY_OWNER,,}.github.io (it is: ${www:-none})" ;; esac
          echo "http:  $(curl -sS -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' "http://$SITE_HOST/" 2>&1)"
          if https=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "https://$SITE_HOST/" 2>&1); then
            echo "https: $https"
          else
            echo "::warning::https://$SITE_HOST/ does not answer with a valid certificate yet: $https"
          fi
