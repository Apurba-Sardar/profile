<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <!-- title, description, canonical, social cards and structured data: seo.js fills this in from src/content.js -->
    <!--seo:head-->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
  </head>
  <body class="is-loading">
    <div id="loader" aria-live="polite">
      <div class="ld-inner">
        <div class="ld-brand display">APURBA SARDAR</div>
        <div class="ld-line"><i></i></div>
        <div class="ld-meta ui"><span>ALTITUDE <b class="ld-alt">12 000</b> M</span><span class="ld-pct">0%</span></div>
        <div class="ld-hint">Best with sound. Scroll to fall.</div>
      </div>
    </div>

    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="layers"></div>
    <main id="main">
      <!-- the site's words as plain HTML, for search engines and visitors without JavaScript (the app takes it out) -->
      <!--seo:body-->
    </main>

    <div id="cursor" aria-hidden="true">
      <div class="c-ring"></div>
      <div class="c-dot"></div>
      <span class="c-label ui"></span>
    </div>
    <div class="toast ui" role="status"></div>

    <noscript>
      <style>
        #loader { display: none; }
        body.is-loading { overflow: auto; }
      </style>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
